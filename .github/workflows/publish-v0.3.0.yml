name: Publish Clatasha HUD v0.3.0

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.3.0.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout v0.3.0 source
        uses: actions/checkout@v4
        with:
          ref: 22312de5b99bd5bf2c0d6e7a72b7a5a25b6eac61

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64

      - name: Install staging files
        run: cmake --install build_x64 --config RelWithDebInfo --prefix package

      - name: Create OBS installation package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $pluginRoot = "package/clatasha-hud"
          $dist = "dist"

          New-Item -ItemType Directory -Force "$dist/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$dist/data/obs-plugins/clatasha-hud/locale" | Out-Null

          Copy-Item "$pluginRoot/bin/64bit/clatasha-hud.dll" "$dist/obs-plugins/64bit/clatasha-hud.dll"
          Copy-Item "$pluginRoot/data/clatasha-fps-helper.exe" "$dist/data/obs-plugins/clatasha-hud/clatasha-fps-helper.exe"
          Copy-Item "$pluginRoot/data/clatasha-opengl-present-hook.dll" "$dist/data/obs-plugins/clatasha-hud/clatasha-opengl-present-hook.dll"
          Copy-Item "$pluginRoot/data/clatasha-d3d11-present-hook.dll" "$dist/data/obs-plugins/clatasha-hud/clatasha-d3d11-present-hook.dll"
          Copy-Item "$pluginRoot/data/locale/en-US.ini" "$dist/data/obs-plugins/clatasha-hud/locale/en-US.ini"

          $required = @(
            "$dist/obs-plugins/64bit/clatasha-hud.dll",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-fps-helper.exe",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-opengl-present-hook.dll",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-d3d11-present-hook.dll",
            "$dist/data/obs-plugins/clatasha-hud/locale/en-US.ini"
          )

          foreach ($file in $required) {
            if (-not (Test-Path $file)) {
              throw "Missing packaged file: $file"
            }
          }

          Compress-Archive -Path "$dist/*" -DestinationPath "Clatasha-HUD-OBS-0.3.0-Windows-x64.zip" -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Clatasha HUD 0.3.0

          Version 0.3.0 expands the fullscreen HUD system and gives users clearer control over what is visible locally versus what is captured by OBS.

          ### Fullscreen HUD
          - Added Direct3D 11 fullscreen HUD support.
          - Added a dedicated OpenGL fullscreen HUD path for supported games.
          - The fullscreen renderers now use the same Qt-rendered HUD frame as the normal desktop HUD.
          - HUD position is synchronized across normal, OpenGL, and Direct3D 11 modes.
          - Improved multi-monitor placement and fullscreen anchoring.
          - Prevents duplicate HUDs in supported borderless/windowed-fullscreen modes.
          - Improved fullscreen FPS, timer, audio-meter, disk-space, recording-state, replay-buffer, and logo synchronization.

          ### Recording and Capture
          - The normal Windows HUD is excluded from supported Windows display-capture paths.
          - Added Display Capture Safe Mode for games where a local-only HUD is preferred.
          - Display Capture Safe Mode is opt-in and does not change game or taskbar behavior unless enabled by the user.
          - Safe Mode can use Clatasha Borderless Fullscreen when needed so the local HUD remains visible.
          - Improved Game Capture behavior so supported fullscreen HUD rendering can remain excluded when third-party overlay capture is disabled.

          ### Recording Visibility Warning
          - Added a 3-second recording-visibility warning when Clatasha switches HUD renderer paths.
          - Green: **DOES NOT SHOW UP IN RECORDINGS** for the normal capture-excluded HUD.
          - Red: **SHOWS UP IN RECORDINGS** for the injected fullscreen HUD.
          - The warning matches the 145 px HUD width and is rendered at full visibility regardless of the normal HUD opacity setting.
          - Top-position HUDs drop the warning below the HUD; bottom-position HUDs show it above the HUD.
          - The warning can be disabled in Clatasha HUD Settings.

          ### Browser Overlays
          - Fixed Video/Both overlay opacity handling in OBS.
          - HUD mode remains local-only.
          - Video mode remains part of the OBS scene/recording.
          - Both mode shows the local overlay and the OBS video copy together.

          ### Stability and Compatibility
          - Improved graphics-renderer detection so incidental OpenGL modules do not override an active Direct3D renderer.
          - Added safeguards to avoid injecting the Direct3D HUD backend into Windows shell processes.
          - Improved fullscreen HUD diagnostics and renderer-state tracking.
          - Preserves reversible Force Borderless Fullscreen behavior and temporary taskbar Auto-hide only when explicitly requested.

          ### Requirements
          - Windows 10 or Windows 11 x64
          - OBS Studio with Browser Source/obs-browser installed and enabled
          - Current development/testing is on OBS Studio 32.2.2

          ### Installation
          1. Close OBS Studio.
          2. Extract **Clatasha-HUD-OBS-0.3.0-Windows-x64.zip** directly into the OBS installation directory, normally `C:\Program Files\obs-studio`.
          3. Replace existing Clatasha HUD files when prompted.
          4. Restart OBS Studio.
          5. Open Clatasha HUD from the **Tools** menu.

          The FPS helper may request elevation because the ETW capture path used for broad FPS detection requires administrator access on some Windows setups.

          ### Fullscreen capture note
          The injected fullscreen HUD is part of the game's rendered frame and can appear in Display Capture recordings. If you want the HUD visible locally without recording it, use a composited borderless mode or enable **Display Capture Safe Mode** in Clatasha HUD settings.
          '@ | Set-Content -Path "release-notes.md" -Encoding UTF8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.3.0" "Clatasha-HUD-OBS-0.3.0-Windows-x64.zip#Windows x64 OBS installation package" `
            --repo "${{ github.repository }}" `
            --target "22312de5b99bd5bf2c0d6e7a72b7a5a25b6eac61" `
            --title "Clatasha HUD - OBS Status Overlay 0.3.0" `
            --notes-file "release-notes.md"
