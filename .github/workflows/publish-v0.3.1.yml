name: Publish Clatasha HUD v0.3.1

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.3.1.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify version
        shell: pwsh
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          if ($spec.version -ne '0.3.1') {
            throw "Expected version 0.3.1, found $($spec.version)"
          }

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64

      - name: Install staging files
        run: cmake --install build_x64 --config RelWithDebInfo --prefix package

      - name: Create OBS installation package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = 'package/clatasha-hud'
          $dist = 'dist'
          New-Item -ItemType Directory -Force "$dist/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$dist/data/obs-plugins/clatasha-hud/locale" | Out-Null

          Copy-Item "$pluginRoot/bin/64bit/clatasha-hud.dll" "$dist/obs-plugins/64bit/clatasha-hud.dll"
          Copy-Item "$pluginRoot/data/clatasha-fps-helper.exe" "$dist/data/obs-plugins/clatasha-hud/clatasha-fps-helper.exe"
          Copy-Item "$pluginRoot/data/clatasha-opengl-present-hook.dll" "$dist/data/obs-plugins/clatasha-hud/clatasha-opengl-present-hook.dll"
          Copy-Item "$pluginRoot/data/clatasha-d3d11-present-hook.dll" "$dist/data/obs-plugins/clatasha-hud/clatasha-d3d11-present-hook.dll"
          Copy-Item "$pluginRoot/data/locale/en-US.ini" "$dist/data/obs-plugins/clatasha-hud/locale/en-US.ini"

          $required = @(
            "$dist/obs-plugins/64bit/clatasha-hud.dll",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-fps-helper.exe",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-opengl-present-hook.dll",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-d3d11-present-hook.dll",
            "$dist/data/obs-plugins/clatasha-hud/locale/en-US.ini"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing packaged file: $file" }
          }

          Compress-Archive -Path "$dist/*" -DestinationPath 'Clatasha-HUD-OBS-0.3.1-Windows-x64.zip' -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Clatasha HUD 0.3.1

          This release adds the customizable Input HUD for keyboard and mouse activity.

          ### Input HUD
          - Choose from the FPS preset or select individual keys and mouse controls on a full keyboard layout. Keyboard sections fit around the keys selected.
          - Use HUD for a private local display, VIDEO for an OBS scene source, or BOTH for both displays.
          - Added a live Clatasha Input HUD source in OBS. Its rendering works in VIDEO and BOTH modes.
          - Added an assignable Show/Hide Input HUD hotkey in Clatasha HUD Settings and OBS Settings. The shortcut preserves the OBS source's position and size.
          - The Scale slider grows the OBS display upward from its bottom edge and preserves placement in existing scenes.
          - Adjustable display scale and opacity.

          ### Requirements
          - Windows 10 or Windows 11 x64.
          - OBS Studio with Browser Source/obs-browser installed and enabled for browser overlays.
          - Tested with OBS Studio 32.2.2.

          ### Installation
          1. Close OBS Studio.
          2. Extract **Clatasha-HUD-OBS-0.3.1-Windows-x64.zip** directly into the OBS installation directory, normally `C:\Program Files\obs-studio`.
          3. Replace existing Clatasha HUD files when prompted and restart OBS Studio.
          4. Open Clatasha HUD from the **Tools** menu. Enable and configure Input HUD under **Advanced**.

          The local HUD is capture-excluded where supported. VIDEO and BOTH include an OBS source intended to appear in recordings and streams.
          '@ | Set-Content -Path 'release-notes.md' -Encoding UTF8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.3.1' 'Clatasha-HUD-OBS-0.3.1-Windows-x64.zip#Windows x64 OBS installation package' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title 'Clatasha HUD - OBS Status Overlay 0.3.1' `
            --notes-file 'release-notes.md'
