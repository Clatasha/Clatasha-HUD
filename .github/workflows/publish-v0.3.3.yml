name: Publish Clatasha HUD v0.3.3

on:
  push:
    branches: [main]
    paths: [.github/workflows/publish-v0.3.3.yml]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify version
        shell: pwsh
        run: |
          $spec = Get-Content buildspec.json -Raw | ConvertFrom-Json
          if ($spec.version -ne '0.3.3') {
            throw "Expected version 0.3.3, found $($spec.version)"
          }

      - name: Configure
        run: cmake --preset windows-x64

      - name: Build
        run: cmake --build --preset windows-x64

      - name: Install staging files
        run: cmake --install build_x64 --config RelWithDebInfo --prefix package

      - name: Create OBS installation package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pluginRoot = 'package/clatasha-hud'
          $dist = 'dist'
          New-Item -ItemType Directory -Force "$dist/obs-plugins/64bit" | Out-Null
          New-Item -ItemType Directory -Force "$dist/data/obs-plugins/clatasha-hud/locale" | Out-Null

          Copy-Item "$pluginRoot/bin/64bit/clatasha-hud.dll" "$dist/obs-plugins/64bit/clatasha-hud.dll"
          Copy-Item "$pluginRoot/data/clatasha-fps-helper.exe" "$dist/data/obs-plugins/clatasha-hud/clatasha-fps-helper.exe"
          Copy-Item "$pluginRoot/data/clatasha-opengl-present-hook.dll" "$dist/data/obs-plugins/clatasha-hud/clatasha-opengl-present-hook.dll"
          Copy-Item "$pluginRoot/data/clatasha-d3d11-present-hook.dll" "$dist/data/obs-plugins/clatasha-hud/clatasha-d3d11-present-hook.dll"
          Copy-Item "$pluginRoot/data/locale/en-US.ini" "$dist/data/obs-plugins/clatasha-hud/locale/en-US.ini"

          $required = @(
            "$dist/obs-plugins/64bit/clatasha-hud.dll",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-fps-helper.exe",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-opengl-present-hook.dll",
            "$dist/data/obs-plugins/clatasha-hud/clatasha-d3d11-present-hook.dll",
            "$dist/data/obs-plugins/clatasha-hud/locale/en-US.ini"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing packaged file: $file" }
          }

          Compress-Archive -Path "$dist/*" -DestinationPath 'Clatasha-HUD-OBS-0.3.3-Windows-x64.zip' -Force

      - name: Write release notes
        shell: pwsh
        run: |
          @'
          ## Clatasha HUD 0.3.3

          This patch fixes Clatasha HUD shortcuts being lost after restarting OBS Studio.

          ### Fixes
          - Save hotkey assignments before OBS clears its hotkey registry during shutdown.
          - Prevent unavailable hotkeys at plugin unload from overwriting saved shortcuts.
          - Restore the complete binding list, including multiple shortcuts assigned to an action in OBS Settings.
          - Migrate existing single-shortcut settings from earlier versions.
          - Applies to shortcuts configured in both Clatasha HUD Settings and OBS Settings.

          The OBS restart fix was confirmed in user testing. This package also includes the desktop/in-game HUD visibility fix from 0.3.2.

          ### Remaining request
          - Configurable HUD visibility at OBS startup remains a requested feature.

          ### Requirements
          - Windows 10 or Windows 11 x64.
          - OBS Studio with Browser Source/obs-browser installed and enabled for browser overlays.
          - Tested with OBS Studio 32.2.2.

          ### Installation
          1. Close OBS Studio.
          2. Extract **Clatasha-HUD-OBS-0.3.3-Windows-x64.zip** directly into the OBS installation directory, normally `C:\Program Files\obs-studio`.
          3. Replace existing Clatasha HUD files when prompted and restart OBS Studio.
          4. Open Clatasha HUD from the **Tools** menu.

          The desktop HUD is capture-excluded where supported. The injected fullscreen status HUD can appear in recordings and streams. Input HUD VIDEO and BOTH modes include an OBS scene source.
          '@ | Set-Content -Path 'release-notes.md' -Encoding UTF8

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 'v0.3.3' 'Clatasha-HUD-OBS-0.3.3-Windows-x64.zip#Windows x64 OBS installation package' `
            --repo '${{ github.repository }}' `
            --target '${{ github.sha }}' `
            --title 'Clatasha HUD - OBS Status Overlay 0.3.3' `
            --notes-file 'release-notes.md'
